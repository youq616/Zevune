name: pinned-cometbft-lifecycle
on:
  push:
    branches: [main, 'dev/**']
    paths: ['integration/cometbft/**', 'scripts/check_cometbft_origin.py', 'scripts/tests/test_cometbft_origin.py', 'scripts/source_snapshot.py', 'scripts/build_local_lab.py', '.gitattributes', '.github/workflows/cometbft-lifecycle.yml']
  pull_request:
    paths: ['integration/cometbft/**', 'scripts/check_cometbft_origin.py', 'scripts/tests/test_cometbft_origin.py', 'scripts/source_snapshot.py', 'scripts/build_local_lab.py', '.gitattributes', '.github/workflows/cometbft-lifecycle.yml']
permissions:
  contents: read
jobs:
  upstream:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOWORK: 'off'
      GOFLAGS: ''
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.27.1'
          cache-dependency-path: integration/cometbft/third_party/cometbft-v0.38.26/go.sum
      - name: Verify original module, permitted patch and actual compiler selection
        run: |
          python scripts/check_cometbft_origin.py
          python -m unittest discover -s scripts/tests -p test_cometbft_origin.py -v
      - name: Run retained upstream and new lifecycle tests explicitly
        working-directory: integration/cometbft/third_party/cometbft-v0.38.26
        run: |
          go test -mod=readonly ./consensus ./node ./p2p ./p2p/conn ./store -count=1 -timeout=15m
          go vet -mod=readonly ./consensus ./node ./p2p ./p2p/conn ./store
      - name: Preserve original application shutdown and restart checks
        working-directory: integration/cometbft
        run: |
          go test -mod=readonly ./devnet -count=1 -timeout=8m -v
          go mod tidy -diff
      - name: Verify no tracked source drift
        run: git diff --exit-code
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOWORK: 'off'
      GOFLAGS: ''
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.27.1'
          cache-dependency-path: integration/cometbft/third_party/cometbft-v0.38.26/go.sum
      - name: Verify exact source selection
        run: python scripts/check_cometbft_origin.py
      - name: Race-check retained upstream and new lifecycle tests
        working-directory: integration/cometbft/third_party/cometbft-v0.38.26
        run: go test -mod=readonly -race ./consensus ./node ./p2p ./p2p/conn ./store -count=1 -timeout=15m
      - name: Original complete integration race regression
        working-directory: integration/cometbft
        run: go test -mod=readonly -race ./... -count=1 -timeout=15m
      - name: Verify no tracked source drift
        run: git diff --exit-code
