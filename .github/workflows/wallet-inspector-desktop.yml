name: wallet-inspector-desktop
on:
  push:
    branches: [main, 'dev/**']
    paths: ['.github/workflows/wallet-backup-catalog.yml', '.github/workflows/wallet-inspector-desktop.yml', 'docs/WALLET_INSPECTOR_DESKTOP.zh-CN.md', 'integration/orchard/**', 'scripts/build_local_lab.py', 'scripts/check_wallet_inspector_backend.py', 'scripts/check_wallet_inspector_gui.py', 'scripts/ledger_recovery_backend.py', 'scripts/ledger_restore.py', 'scripts/source_snapshot.py', 'scripts/tests/test_local_bundle.py', 'scripts/tests/test_verify_local_lab.py', 'scripts/tests/test_wallet_backup.py', 'scripts/tests/test_wallet_backup_source.py', 'scripts/tests/test_wallet_inspector_desktop.py', 'scripts/tests/test_wallet_inspector_source.py', 'scripts/verify_local_lab.py', 'scripts/wallet_archive.py', 'scripts/wallet_backup.py', 'scripts/wallet_backup_backend.py', 'scripts/wallet_health.py', 'scripts/wallet_inspector_desktop.py', 'scripts/wallet_reconcile.py', 'scripts/zevune_wallet.py']
  pull_request:
    paths: ['.github/workflows/wallet-backup-catalog.yml', '.github/workflows/wallet-inspector-desktop.yml', 'docs/WALLET_INSPECTOR_DESKTOP.zh-CN.md', 'integration/orchard/**', 'scripts/build_local_lab.py', 'scripts/check_wallet_inspector_backend.py', 'scripts/check_wallet_inspector_gui.py', 'scripts/ledger_recovery_backend.py', 'scripts/ledger_restore.py', 'scripts/source_snapshot.py', 'scripts/tests/test_local_bundle.py', 'scripts/tests/test_verify_local_lab.py', 'scripts/tests/test_wallet_backup.py', 'scripts/tests/test_wallet_backup_source.py', 'scripts/tests/test_wallet_inspector_desktop.py', 'scripts/tests/test_wallet_inspector_source.py', 'scripts/verify_local_lab.py', 'scripts/wallet_archive.py', 'scripts/wallet_backup.py', 'scripts/wallet_backup_backend.py', 'scripts/wallet_health.py', 'scripts/wallet_inspector_desktop.py', 'scripts/wallet_reconcile.py', 'scripts/zevune_wallet.py']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      RAYON_NUM_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
      ZEVUNE_CATALOG_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact public source identity
        run: |
          python - <<'PY_SOURCE'
          import json, os, re, subprocess
          expected = os.environ['ZEVUNE_CATALOG_SOURCE_HEAD']
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('Invalid expected catalog commit')
          def git(*args):
              return subprocess.check_output(['git', '--no-replace-objects', *args], text=True).strip()
          actual = git('rev-parse', 'HEAD')
          # The externally supplied commit hash binds its exact tree. Do not
          # silently substitute a synthetic merge when the base branch moves.
          expected_tree = git('show', '-s', '--format=%T', expected)
          actual_tree = git('rev-parse', 'HEAD^{tree}')
          if actual != expected or actual_tree != expected_tree or not re.fullmatch(r'[0-9a-f]{40}', expected_tree):
              raise SystemExit('Catalog source identity mismatch')
          subprocess.run(['git', '--no-replace-objects', 'diff', '--exit-code', 'HEAD', '--'], check=True)
          print(json.dumps({'source_head': expected, 'checkout_commit': actual, 'source_tree': actual_tree}))
          PY_SOURCE
      - name: Immutable inputs, job cleanup, source and unchanged bundle contracts
        run: |
          python -m unittest discover -s scripts/tests -p test_wallet_inspector_desktop.py -v
          python -m unittest discover -s scripts/tests -p test_wallet_inspector_source.py -v
          python -m unittest discover -s scripts/tests -p test_wallet_backup_source.py -v
          python -m unittest discover -s scripts/tests -p test_local_bundle.py -v
          python -m unittest discover -s scripts/tests -p test_verify_local_lab.py -v
      - name: Linux display server and Python Tk support only
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo -n apt-get update
          sudo -n apt-get install --yes --no-install-recommends python3-tk xvfb xauth
      - name: Real Tk hidden password, event loop, close and refusal paths
        timeout-minutes: 2
        run: |
          python -c 'import tkinter; print("Tk available:", tkinter.TkVersion)'
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/check_wallet_inspector_gui.py -v
          else
            python scripts/check_wallet_inspector_gui.py -v
          fi
      - name: Install fixed Rust and build original authentic wallet
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cargo +1.98.1 fmt --manifest-path integration/orchard/Cargo.toml --all -- --check
          cargo +1.98.1 build --manifest-path integration/orchard/Cargo.toml --locked --release --features local-funding-lab --bin zevune-wallet-local
      - name: Real read-only inspection and unchanged signed pending reservation
        timeout-minutes: 11
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          suffix = '.exe' if os.name == 'nt' else ''
          backend = (pathlib.Path('integration/orchard/target/release') / ('zevune-wallet-local' + suffix)).resolve(strict=True)
          command = [sys.executable, 'scripts/check_wallet_inspector_backend.py', str(backend)]
          if os.name != 'nt':
              command = ['xvfb-run', '-a', *command]
          subprocess.run(command, check=True, timeout=600)
          PY
      - name: Source and dependency locks unchanged; no private artifacts
        run: git diff --exit-code
