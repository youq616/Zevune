name: crate-notice-inventory
on:
  push:
    branches: [main, 'dev/**']
    paths:
      - 'scripts/audit_crate_notices.py'
      - 'scripts/tests/test_crate_notices.py'
      - '.github/workflows/crate-notices.yml'
  pull_request:
    paths:
      - 'scripts/audit_crate_notices.py'
      - 'scripts/tests/test_crate_notices.py'
      - '.github/workflows/crate-notices.yml'
permissions:
  contents: read
jobs:
  offline-notices:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Offline synthetic archive regression tests
        run: |
          python --version
          python -m unittest discover -s scripts/tests -p 'test_crate_notices.py' -v
      - name: Preserve committed source
        run: git diff --exit-code
