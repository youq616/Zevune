name: prepare-funded-development-source
on:
  push:
    branches: ['dev/m9-funded-payments']
    paths: ['scripts/prepare-funded-lab.py', '.github/workflows/m9-prepare.yml']
permissions:
  contents: write
concurrency:
  group: m9-source-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/dev/m9-funded-payments'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.27.1'
          cache: false
      - name: Prepare exact additive source and record canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          python scripts/prepare-funded-lab.py
          test "$(git ls-remote origin refs/heads/dev/m9-funded-payments | cut -f1)" = "$EXPECTED_HEAD"
          git add integration/orchard/Cargo.toml integration/orchard/src/pool.rs integration/orchard/src/pool/testnet.rs integration/orchard/src/wallet.rs integration/orchard/src/wallet_history.rs integration/orchard/src/bin/zevune-pool-worker.rs integration/orchard/src/bin/zevune-funded-scenario.rs internal/poolbridge/client.go internal/poolbridge/genesis.go internal/poolbridge/genesis_test.go integration/cometbft/poolapp/app.go integration/cometbft/poolapp/e2e_test.go integration/cometbft/poolapp/funded_e2e_test.go integration/cometbft/poolapp/genesis.go integration/cometbft/poolapp/genesis_test.go
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record explicit opt-in funded genesis and wallet-consensus integration source'
          git push origin HEAD:refs/heads/dev/m9-funded-payments
