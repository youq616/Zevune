name: m11-source-review
on:
  push:
    branches: ['dev/m11-local-network-operator']
    paths: ['.github/workflows/m11-source-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Archive only tracked source for exact-commit local review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-review"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source-review/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-review/COMMIT"
          cd "$RUNNER_TEMP/source-review"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m11-source-review
          path: ${{ runner.temp }}/source-review/
          retention-days: 2
          if-no-files-found: error
