name: wallet-durability-format-once
on:
  push:
    branches: [dev/m8-wallet-durability]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
      - name: Apply only pinned formatting, preserving branch ancestry
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cd integration/orchard
          cargo fmt --all
          cd ../..
          python - <<'PY'
          import subprocess
          allowed = {
              'integration/orchard/src/wallet/vault.rs',
              'integration/orchard/src/wallet/vault/store.rs',
              'integration/orchard/src/wallet/vault/store/tests.rs',
              'integration/orchard/src/wallet_flow_tests.rs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if not changed.issubset(allowed):
              raise SystemExit('formatter changed a file outside the reviewed scope')
          PY
          test "$(git ls-remote origin refs/heads/dev/m8-wallet-durability | cut -f1)" = "$EXPECTED_HEAD"
          git add integration/orchard/src/wallet/vault.rs integration/orchard/src/wallet/vault/store.rs integration/orchard/src/wallet/vault/store/tests.rs integration/orchard/src/wallet_flow_tests.rs
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply pinned Rust formatting to wallet durability sources'
          git push origin HEAD:refs/heads/dev/m8-wallet-durability
