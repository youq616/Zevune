name: wallet-reconcile
on:
  push:
    branches: [main, 'dev/**']
    paths: ['integration/orchard/**', 'scripts/wallet_reconcile.py', 'scripts/check_wallet_reconcile_backend.py', 'scripts/tests/test_wallet_reconcile.py', 'scripts/tests/test_wallet_reconcile_transport.py', 'scripts/tests/test_wallet_reconcile_source.py', 'docs/WALLET_RECONCILE.zh-CN.md', '.github/workflows/wallet-reconcile.yml', 'scripts/ledger_restore.py', 'scripts/ledger_recovery_backend.py', 'scripts/wallet_backup.py', 'scripts/wallet_backup_backend.py', 'scripts/wallet_archive.py', 'scripts/wallet_health.py', 'scripts/zevune_wallet.py', 'scripts/source_snapshot.py', 'scripts/build_local_lab.py', 'scripts/verify_local_lab.py', 'scripts/tests/test_local_bundle.py', 'scripts/tests/test_verify_local_lab.py', 'scripts/tests/test_wallet_backup.py', 'scripts/tests/test_ledger_restore.py', 'scripts/wallet_maintenance.py', 'scripts/tests/test_active_enospc.py', 'scripts/run_active_enospc.py', 'scripts/wallet_prepare_evidence.py', '.github/workflows/wallet-backup-catalog.yml', 'scripts/tests/test_wallet_backup_source.py']
  pull_request:
    paths: ['integration/orchard/**', 'scripts/wallet_reconcile.py', 'scripts/check_wallet_reconcile_backend.py', 'scripts/tests/test_wallet_reconcile.py', 'scripts/tests/test_wallet_reconcile_transport.py', 'scripts/tests/test_wallet_reconcile_source.py', 'docs/WALLET_RECONCILE.zh-CN.md', '.github/workflows/wallet-reconcile.yml', 'scripts/ledger_restore.py', 'scripts/ledger_recovery_backend.py', 'scripts/wallet_backup.py', 'scripts/wallet_backup_backend.py', 'scripts/wallet_archive.py', 'scripts/wallet_health.py', 'scripts/zevune_wallet.py', 'scripts/source_snapshot.py', 'scripts/build_local_lab.py', 'scripts/verify_local_lab.py', 'scripts/tests/test_local_bundle.py', 'scripts/tests/test_verify_local_lab.py', 'scripts/tests/test_wallet_backup.py', 'scripts/tests/test_ledger_restore.py', 'scripts/wallet_maintenance.py', 'scripts/tests/test_active_enospc.py', 'scripts/run_active_enospc.py', 'scripts/wallet_prepare_evidence.py', '.github/workflows/wallet-backup-catalog.yml', 'scripts/tests/test_wallet_backup_source.py']
permissions:
  contents: read
jobs:
  reconcile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      RAYON_NUM_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
      ZEVUNE_CATALOG_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact public source identity
        run: |
          python - <<'PY_SOURCE'
          import json, os, re, subprocess
          expected = os.environ['ZEVUNE_CATALOG_SOURCE_HEAD']
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('Invalid expected catalog commit')
          def git(*args):
              return subprocess.check_output(['git', '--no-replace-objects', *args], text=True).strip()
          actual = git('rev-parse', 'HEAD')
          # The externally supplied commit hash binds its exact tree. Do not
          # silently substitute a synthetic merge when the base branch moves.
          expected_tree = git('show', '-s', '--format=%T', expected)
          actual_tree = git('rev-parse', 'HEAD^{tree}')
          if actual != expected or actual_tree != expected_tree or not re.fullmatch(r'[0-9a-f]{40}', expected_tree):
              raise SystemExit('Catalog source identity mismatch')
          subprocess.run(['git', '--no-replace-objects', 'diff', '--exit-code', 'HEAD', '--'], check=True)
          print(json.dumps({'source_head': expected, 'checkout_commit': actual, 'source_tree': actual_tree}))
          PY_SOURCE
      - name: Ancestor, response, budget, source and package regressions
        run: |
          python -m unittest discover -s scripts/tests -p test_wallet_reconcile.py -v
          python -m unittest discover -s scripts/tests -p test_wallet_reconcile_transport.py -v
          python -m unittest discover -s scripts/tests -p test_wallet_reconcile_source.py -v
          python -m unittest discover -s scripts/tests -p test_wallet_backup_source.py -v
          python -m unittest discover -s scripts/tests -p test_local_bundle.py -v
          python -m unittest discover -s scripts/tests -p test_verify_local_lab.py -v
      - name: Install fixed Rust and build unchanged authentic local backends
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cargo +1.98.1 fmt --manifest-path integration/orchard/Cargo.toml --all -- --check
          cargo +1.98.1 build --manifest-path integration/orchard/Cargo.toml --locked --release --features local-funding-lab --bin zevune-wallet-local --bin zevune-pool-worker --bin zevune-pool-recovery
      - name: Real ancestor reconciliation, exact pending, inclusion, expiry and rollback refusal
        timeout-minutes: 11
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          suffix = '.exe' if os.name == 'nt' else ''
          folder = pathlib.Path('integration/orchard/target/release').resolve(strict=True)
          backends = [str((folder / (name + suffix)).resolve(strict=True)) for name in ('zevune-wallet-local', 'zevune-pool-worker', 'zevune-pool-recovery')]
          subprocess.run([sys.executable, 'scripts/check_wallet_reconcile_backend.py', *backends],
                         check=True, timeout=600)
          PY
      - name: Preserve source and dependency locks; no private artifacts
        run: git diff --exit-code
