name: consensus-laboratory
on:
  push:
    branches: [main, 'dev/m3-*', 'dev/m4-orchard']
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
        working-directory: integration/cometbft
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: integration/cometbft/go.sum
      - name: Verify locked dependencies and canonical source
        run: |
          go version
          go mod download
          go mod verify
          go mod tidy -diff
          test -z "$(gofmt -l .)"
      - name: Adapter and four independent process integration tests
        run: go test -mod=readonly ./... -count=1 -timeout=8m -v
      - name: Static analysis
        run: go vet -mod=readonly ./...
      - name: Adapter race checks
        if: runner.os == 'Linux'
        run: go test -mod=readonly -race ./app -count=1 -timeout=3m
      - name: Build local launcher
        run: go build -mod=readonly ./cmd/zevune-devnet
      - name: Assert checks did not modify tracked files
        run: git diff --exit-code
