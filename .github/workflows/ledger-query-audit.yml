name: ledger-query-audit
on:
  push:
    branches: [main, 'dev/**']
    paths: ['scripts/**', 'docs/**', 'integration/orchard/**', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', 'docs/**', 'integration/orchard/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      ZEVUNE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source and audit contracts
        run: |
          python - <<'PY_SOURCE'
          import json, os, re, subprocess
          expected = os.environ['ZEVUNE_SOURCE_HEAD']
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
          def git(*args):
              return subprocess.check_output(['git', '--no-replace-objects', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == expected
          tree = git('rev-parse', 'HEAD^{tree}')
          assert re.fullmatch(r'[0-9a-f]{40}', tree)
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)
          print(json.dumps({'source_head': expected, 'source_tree': tree}))
          PY_SOURCE
          python -B -m unittest discover -s scripts/tests -p 'test_ledger_query_audit*.py' -v
          python -B -m unittest discover -s scripts/tests -p 'test_ledger_query_request.py' -v
      - name: Real offline CLI with execution and ledger access prohibited
        run: python -B scripts/check_ledger_query_audit.py
      - name: Tracked source unchanged
        run: git diff --exit-code
