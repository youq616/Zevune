name: wallet-laboratory
on:
  push:
    branches: ['dev/m8-wallet-local']
  pull_request:
    paths: ['integration/orchard/**', '.github/workflows/wallet-lab.yml']
permissions:
  contents: read
jobs:
  wallet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      RAYON_NUM_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Install fixed Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Development-only additive bootstrap
        run: python scripts/bootstrap-wallet-lab.py
      - name: Actual wallet, encrypted recovery and unchanged cryptography tests
        working-directory: integration/orchard
        run: |
          cargo test --locked --release -- --nocapture --test-threads=1
          cargo clippy --locked --release --all-targets -- -D warnings
          cargo fmt --all -- --check
  record:
    needs: wallet
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/m8-wallet-local'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
      - name: Record additive normalized sources only after both platform tests
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          python scripts/bootstrap-wallet-lab.py
          test "$(git ls-remote origin refs/heads/dev/m8-wallet-local | cut -f1)" = "$EXPECTED_HEAD"
          git add integration/orchard/Cargo.toml integration/orchard/Cargo.lock integration/orchard/src/lib.rs integration/orchard/src/pool.rs integration/orchard/src/pool_tests.rs integration/orchard/src/wallet.rs integration/orchard/src/wallet/vault.rs integration/orchard/src/wallet_history.rs integration/orchard/src/wallet_flow_tests.rs
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record tested M8 wallet modules, formatting and additive dependency lock'
          git push origin HEAD:refs/heads/dev/m8-wallet-local
