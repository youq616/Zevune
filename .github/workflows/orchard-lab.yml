name: orchard-cryptography-laboratory
on:
  push:
    branches: [main, 'dev/**']
    paths: ['integration/orchard/**', '.github/workflows/orchard-lab.yml', '.gitattributes']
  pull_request:
    paths: ['integration/orchard/**', '.github/workflows/orchard-lab.yml', '.gitattributes']
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: integration/orchard
    env:
      RAYON_NUM_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check committed formatting and dependency lock
        run: |
          rustc --version
          cargo fmt --all -- --check
          cargo metadata --locked --format-version=1 > /dev/null
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Real proofs, signatures, decryption and pool state replay
        run: cargo test --locked --release -- --nocapture --test-threads=1
      - name: Static checks
        run: cargo clippy --locked --release --all-targets -- -D warnings
      - name: Assert no tracked source or dependency drift
        run: git diff --exit-code
